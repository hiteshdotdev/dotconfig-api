[project]
name = "dotconfig-api"
version = "0.1.0"
description = "Flask REST API backed by MySQL"
authors = [
    { name = "hitesh", email = "hiteshdotdev@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "flask>=3.1,<4",
    "pymysql>=1.1,<2",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
dotconfig-api = "dotconfig_api:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
